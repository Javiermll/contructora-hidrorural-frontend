<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="%BASE_URL%assets/LogoHidrorural.png"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/LogoHidrorural.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Constructora Hidrorural</title>
    <meta name="author" content="Javier Muñoz Ll." />
    <meta
      name="description"
      content="Constructora Hidrorural: proyectos de construcción sanitaria e hidráulica en Chile."
    />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <!-- SPA redirect handler for GitHub Pages BrowserRouter -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
        var search = location.search;
        if (search.indexOf("?p=/") === 0) {
          var decoded =
            location.pathname.slice(0, -1) +
            "/" +
            search.slice(3).replace(/~and~/g, "&") +
            location.hash;
          history.replaceState(null, null, decoded);
        }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:site_name" content="Constructora Hidrorural" />
    <meta property="og:title" content="Constructora Hidrorural" />
    <meta
      property="og:description"
      content="Proyectos de construcción sanitaria e hidráulica en Chile."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%BASE_URL%assets/LogoHidrorural.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Constructora Hidrorural" />
    <meta
      name="twitter:description"
      content="Proyectos de construcción sanitaria e hidráulica en Chile."
    />
    <meta name="twitter:image" content="%BASE_URL%assets/LogoHidrorural.png" />
  </head>

  </body>
</html>
